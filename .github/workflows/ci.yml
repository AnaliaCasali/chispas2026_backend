# CI: en cada PR y push a main corre los tests contra un MySQL con db/chispas_bd.sql
# CD: al mergear a main publica la imagen Docker en GitHub Container Registry (ghcr.io)
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    # valores solo para los tests, no son los de produccion
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: chispas
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET: Y2hpc3Bhcy1jaS1jbGF2ZS1kZS1wcnVlYmEtMzItYnl0ZXM=
      MAIL_USERNAME: ci@example.com
      MAIL_PASSWORD: ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Crear la base con chispas_bd.sql
        run: mysql -h 127.0.0.1 -uroot -proot < db/chispas_bd.sql

      - name: Tests
        run: ./mvnw -B verify

      - name: Reporte de tests y cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes
          path: |
            target/surefire-reports/
            target/site/jacoco/

  docker:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # ghcr exige el nombre en minusculas
      - name: Nombre de la imagen
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Login a ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # en los PR solo verifica que la imagen compile; en main la publica
      - name: Build (y push en main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
