# CI: en cada PR y push a main corre los tests (MySQL con Testcontainers + db/chispas_bd.sql) y el reporte JaCoCo
# CD: al mergear a main publica la imagen Docker en GitHub Container Registry (ghcr.io)
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # los tests levantan su propio MySQL con Testcontainers (Docker ya viene en el runner)
      # y cargan db/chispas_bd.sql: no hace falta .env ni variables de entorno
      - name: Tests y cobertura
        run: ./mvnw -B verify

      - name: Resumen de cobertura
        if: always()
        run: |
          csv=target/site/jacoco/jacoco.csv
          [ -f "$csv" ] || exit 0
          awk -F, 'NR>1 {lm+=$8; lc+=$9; bm+=$6; bc+=$7} END {
            printf "### Cobertura JaCoCo\n\n| | Cubiertas | Total | %% |\n| --- | --- | --- | --- |\n"
            printf "| Lineas | %d | %d | %.1f |\n", lc, lm+lc, lc*100/(lm+lc)
            printf "| Ramas | %d | %d | %.1f |\n", bc, bm+bc, bc*100/(bm+bc)
          }' "$csv" >> "$GITHUB_STEP_SUMMARY"

      - name: Reporte de tests y cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes
          path: |
            target/surefire-reports/
            target/site/jacoco/

  docker:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # ghcr exige el nombre en minusculas
      - name: Nombre de la imagen
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Login a ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # en los PR solo verifica que la imagen compile; en main la publica
      - name: Build (y push en main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
