# Levanta MySQL + backend: docker compose up --build
# Usa las variables del .env (copiar .env.example). Al arrancar, el backend crea las tablas
# (db/chispasEsquema.sql) y, si no hay usuarios, carga los datos de ejemplo (db/chispasInserts.sql).
# Para empezar de cero: docker compose down -v
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-chispas}
      TZ: America/Argentina/Buenos_Aires
    ports:
      - "${DB_HOST_PORT:-3307}:3306"
    volumes:
      - chispas-db:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: .
    env_file: .env
    environment:
      # dentro de la red de Docker la base es el servicio "db" en su puerto interno
      DB_HOST: db
      DB_PORT: 3306
      DB_USERNAME: root
      TZ: America/Argentina/Buenos_Aires
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  chispas-db:
